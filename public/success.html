<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>支付成功 - Jirvs</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f5f7fa;margin:0;padding:40px 20px;display:flex;justify-content:center}
.card{background:#fff;border-radius:16px;padding:40px;max-width:420px;width:100%;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.check{width:72px;height:72px;border-radius:50%;background:#e6f4ea;color:#1e7e34;font-size:36px;line-height:72px;margin:0 auto 20px}
h1{font-size:24px;margin:0 0 8px}
.sub{color:#666;font-size:14px;margin-bottom:24px}
.btn{display:block;background:#4a7c7e;color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;width:100%;cursor:pointer;margin-top:16px;text-decoration:none}
.footer{margin-top:20px;color:#999;font-size:12px}
</style>
</head>
<body>
<div class="card">
<div class="check">✓</div>
<h1>支付成功</h1>
<div class="sub">通过银行卡完成</div>
<a class="btn" id="backBtn" href="#">返回商家</a>
<div class="footer">安全支付由 Stripe 提供 · 技术支持 Jirvs</div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var orig = q.get('orig');
  var btn = document.getElementById('backBtn');
  if (orig) {
    btn.href = orig;
    // 3秒后自动跳转
    setTimeout(function(){ location.href = orig; }, 3000);
  } else {
    btn.style.display = 'none';
  }
})();
</script>
</body>
</html>
