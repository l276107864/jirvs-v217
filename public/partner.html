<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jirvs 生态合作伙伴中心</title>
<style>
:root{
  --teal:#1769ff; --teal-d:#0f52d1; --gold:#c48a3a; --ink:#0f172a;
  --bg:#f6f8fb; --line:#e4e8ef; --muted:#5b6678; --ok:#127a4b; --err:#e11d48;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;border-radius:12px}
.primary{background:var(--teal);color:#fff;padding:10px 20px;font-weight:600}
.primary:hover{background:var(--teal-d)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);padding:9px 16px}
.ghost:hover{background:#f6f8f7}
.gold-btn{background:var(--gold);color:#fff;padding:10px 20px;font-weight:600}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(23,105,255,.15)}
label{display:block;font-size:13px;color:#334;margin:14px 0 6px}
.hint{font-size:12px;color:var(--muted);line-height:1.7}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:8px}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;background:#e8f1f0;color:var(--teal-d)}
.tag.ok{background:#e3f4ec;color:var(--ok)}
.tag.bad{background:#fbe9e7;color:var(--err)}
.tag.warn{background:#fdf3e3;color:#b0791f}
/* 登录 */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#ffffff 0%,var(--bg) 100%)}
.login-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:36px 32px;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(15,23,42,.11),0 5px 18px rgba(15,23,42,.04)}
.login-card h1{font-size:21px;margin-bottom:4px}
.login-card h1 span{color:var(--teal)}
.login-card .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.demo-jump{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px}
.demo-jump .hint{margin-bottom:8px}
.demo-jump button{width:100%;margin-top:8px}
/* 头部 */
header{background:rgba(255,255,255,.96);color:var(--ink);padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.hwrap{max-width:860px;margin:0 auto}
header .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
header h1{font-size:22px}
header h1 span{color:var(--teal);font-size:15px;font-weight:600;margin-left:8px}
.hbtns{display:flex;gap:8px;flex:none}
.hbtns button{background:#fff;border:1px solid var(--line);color:var(--ink);padding:7px 14px;font-size:13px}
.bell{position:relative;font-size:16px!important;padding:7px 12px!important}
.bell .bdg{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:999px;background:#e11d48;color:#fff;font-size:11px;font-weight:700;padding:0 5px}
.hbtns button:hover{background:#f9fafb}
.hrow{padding:9px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.hwrap .hlk{font-weight:700;color:var(--blue);word-break:break-all}
.hwrap .hcopy{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--blue);font-weight:700;margin-left:8px;flex:none}
.hrow:last-child{border-bottom:none}
.hrow .lab{color:var(--muted)}
.hrow .lab b{color:var(--ink);font-weight:650;margin-right:8px}
/* 内容 */
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 40px}
.sec{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.sec h2{font-size:16px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.vip-locked{border:1.5px dashed #c7cedb;border-radius:14px;padding:14px 16px;color:#9aa3b5;background:#f4f6fa;font-size:13.5px}
.vip-open{border:1.5px solid var(--blue);border-radius:14px;padding:14px 16px;background:#eef4ff;font-size:13.5px}
.vip-signed{border:1.5px solid #bfe3cd;border-radius:14px;padding:14px 16px;background:#f0faf3;font-size:13.5px}
.notice-hi{background:linear-gradient(135deg,#e3eeff,#f2f7ff);border:1.5px solid var(--blue);color:var(--ink);font-size:15px;box-shadow:0 4px 14px rgba(23,105,255,.12)}
.notice-hi b{color:var(--blue)}
.notice{border:1px solid #b8d3ff;background:#eaf2ff;border-radius:14px;padding:14px 16px;margin-top:12px;font-size:13px;line-height:1.9}
.notice b{color:var(--teal-d)}
.agr-box{border:1px solid var(--line);border-radius:14px;background:#fbfcfe;padding:18px;max-height:320px;overflow-y:auto;font-size:13px;line-height:1.9;color:#223}
.agr-box h3{text-align:center;font-size:16px;margin-bottom:4px}
.agr-box .meta{text-align:center;color:var(--muted);font-size:12px;margin-bottom:12px}
.agr-box h4{font-size:13.5px;margin:14px 0 4px}
.seg{display:flex;gap:8px;margin-top:6px}
.seg button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:9px}
.seg button.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}
.sigwrap{border:1.5px dashed #c4cfdd;border-radius:12px;background:#fff}
#sigPad{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair;border-radius:12px}
.recbox{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:2;background:#fbfcfe}
.req{color:#e5484d;margin-left:3px;font-weight:700}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:13px;line-height:1.7;cursor:pointer}
.chk input{width:17px;height:17px;margin-top:2px;flex:none;accent-color:var(--teal)}
.linkbox{display:flex;gap:8px;align-items:stretch;margin-top:10px}
.linkbox .lk{flex:1;background:#0f172a;color:#bfdbfe;font-family:ui-monospace,Menlo,monospace;font-size:13px;border-radius:9px;padding:11px 12px;word-break:break-all}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:21px;font-weight:700;margin-top:4px}
.stat .v.gold{color:var(--gold)} .stat .v.teal{color:var(--teal-d)} .stat .v.red{color:var(--err)}
.stat .u{font-size:12px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px;background:#f6f8fb}
tr:last-child td{border-bottom:none}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
.modal-mask.open{display:flex}
.modal{background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(15,23,42,.25);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:22px}
.modal h3{font-size:16px;margin-bottom:12px}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;display:none;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.locked{opacity:.45;pointer-events:none}
@media (max-width:640px){ .cards{grid-template-columns:repeat(2,1fr)} .linkbox{flex-direction:column} }
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginView">

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 2200); }
async function copyText(txt) {
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch {}
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
      ok = document.execCommand('copy'); ta.remove();
    } catch {}
  }
  toast(ok ? '已复制' : '复制失败，请长按复制');
}
const closeM = (id) => $(id).classList.remove('open');
async function apiGet(url) {
  const r = await fetch(url, { credentials: 'include' });
  if (r.status === 401) { doLogout(); throw new Error('登录已过期，请重新登录'); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || '请求失败');
  return j;
}
async function apiPost(url, body) {
  const r = await fetch(url, { method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || '请求失败');
  return j;
}

/* ===== v21.7 协议全文 ===== */
const AGREEMENT_HTML = `<h3 id="agrTitle">Jirvs 生态合作伙伴合作协议</h3>
<div class="meta" id="agrMeta">协议编号：JIRVS-ECO-2026-001 ｜ 版本：V1.1</div>

let ptype = 'person';
let sigDrawn = false;

/* ===== 登录/注册 ===== */
async function doLogin() {
  const email = $('loginEmail').value.trim();
  const pw = $('loginPw').value;
  if (!email || !pw) { $('loginErr').textContent = '请填写邮箱和密码'; return; }
  $('loginErr').textContent = '';
  try {
    await apiPost('/api/partner/login', { email, password: pw });
    await loadAll();
  } catch (e) { $('loginErr').textContent = e.message; }
}
function doLogout() {
  apiPost('/api/partner/logout', {}).catch(() => {});
  me = null;
  $('appView').hidden = true;
  $('signupView').style.display = 'none';
  $('loginView').style.display = 'flex';
}
function showSignup() {
  $('loginView').style.display = 'none';
  $('signupView').style.display = 'block';
  renderSignupForm();
}
function backToLogin() {
  $('signupView').style.display = 'none';
  $('loginView').style.display = 'flex';
}
function setType(t) {
  ptype = t;
  $('segPerson').classList.toggle('on', t === 'person');
  $('segCompany').classList.toggle('on', t === 'company');
  $('personFields').hidden = t !== 'person';
  $('companyFields').hidden = t !== 'company';
}
function chkState() { const b = $('signBtn'); if (b) b.disabled = !$('chkAll').checked; }

function renderSignupForm() {
  $('signupForm').innerHTML = `
    <div class="notice notice-hi"><b>佣金政策</b>：$199 终身订阅，一次性返佣。V1 生态合作伙伴 30%，V2 战略合作伙伴（特邀）50%。每月 5 日打出上月佣金。</div>
    <div class="agr-box" style="margin-top:12px;max-height:260px">${AGREEMENT_HTML}</div>
    <label>登录邮箱<span class="req">*</span></label><input id="sEmail" type="email" placeholder="用于登录">
    <label>登录密码<span class="req">*</span></label><input id="sPassword" type="password" placeholder="至少 6 位">
    <label>伙伴类型</label>
    <div class="seg">
      <button id="segPerson" class="on" onclick="setType('person')">个人</button>
      <button id="segCompany" onclick="setType('company')">企业</button>
    </div>
    <div id="personFields">
      <label>姓名（与身份证一致）<span class="req">*</span></label><input id="fName" placeholder="例如：王海">
      <label>身份证号<span class="req">*</span></label><input id="fIdno" placeholder="18 位身份证号">
    </div>
    <div id="companyFields" hidden>
      <label>公司名称（与营业执照一致）<span class="req">*</span></label><input id="fCompany" placeholder="例如：某某科技有限公司">
      <label>统一社会信用代码<span class="req">*</span></label><input id="fCredit" placeholder="18 位统一社会信用代码">
      <label>法定代表人<span class="req">*</span></label><input id="fLegal" placeholder="法定代表人姓名">
    </div>
    <label>联系电话<span class="req">*</span></label><input id="fPhone" placeholder="手机号">
    <label>开户银行<span class="req">*</span></label><input id="fBank" placeholder="例如：招商银行">
    <label>银行卡号（佣金打到此卡）<span class="req">*</span></label><input id="fAccount" placeholder="银行卡号">
    <label class="chk"><input type="checkbox" id="chkAll" onchange="chkState()"><span>我已逐条阅读并同意《Jirvs 生态合作伙伴合作协议》全部条款，遵守第五条合规与推广红线。</span></label>
    <div class="err" id="signErr"></div>
    <label>手写签名（请在框内签下你的姓名）<span class="req">*</span></label>
    <div class="sigwrap"><canvas id="sigPad" width="660" height="340"></canvas></div>
    <div class="mrow" style="justify-content:flex-start;margin-top:6px"><button class="ghost" type="button" onclick="clearSig()">清除重写</button></div>
    <button class="primary" id="signBtn" style="width:100%;padding:13px;margin-top:10px" disabled onclick="doSignup()">同意并签署</button>`;
  requestAnimationFrame(initSig);
}

async function doSignup() {
  const email = $('sEmail').value.trim();
  const password = $('sPassword').value;
  const nm = ptype === 'person' ? $('fName').value.trim() : $('fCompany').value.trim();
  if (!sigDrawn) { $('signErr').textContent = '请先在签名框内手写签名'; return; }
  if (!email || !password || password.length < 6) { $('signErr').textContent = '请填写有效邮箱和至少 6 位密码'; return; }
  if (!nm || !$('fPhone').value.trim() || !$('fBank').value.trim() || !$('fAccount').value.trim()) {
    $('signErr').textContent = '带 * 的每一项都是必填'; return;
  }
  $('signErr').textContent = '';
  try {
    await apiPost('/api/partner/signup', {
      email, password, name: nm, type: ptype,
      phone: $('fPhone').value.trim(),
      legal_name: ptype === 'company' ? $('fLegal').value.trim() : nm,
      bank_account: $('fBank').value.trim() + ' ****' + $('fAccount').value.trim().slice(-4),
      credit_code: ptype === 'company' ? $('fCredit').value.trim() : $('fIdno').value.trim(),
    });
    $('signupView').style.display = 'none';
    await loadAll();
    toast('签约成功，专属推荐链接已生成');
  } catch (e) { $('signErr').textContent = e.message; }
}

/* ===== 签名板 ===== */
function initSig() {
  const c = $('sigPad'); if (!c || c._inited) return; c._inited = true;
  const x = c.getContext('2d');
  x.lineWidth = 3; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#111827';
  let down = false, last = null;
  const pos = (e) => { const r = c.getBoundingClientRect(); const sx = c.width / r.width, sy = c.height / r.height; return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy }; };
  c.addEventListener('mousedown', (e) => { e.preventDefault(); down = true; last = pos(e); x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(last.x + 0.1, last.y + 0.1); x.stroke(); sigDrawn = true; });
  c.addEventListener('mousemove', (e) => { if (!down) return; const p = pos(e); x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(p.x, p.y); x.stroke(); last = p; });
  window.addEventListener('mouseup', () => { down = false; });
  c.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.touches[0]; down = true; last = pos(t); x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(last.x + 0.1, last.y + 0.1); x.stroke(); sigDrawn = true; }, { passive: false });
  c.addEventListener('touchmove', (e) => { e.preventDefault(); if (!down) return; const p = pos(e.touches[0]); x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(p.x, p.y); x.stroke(); last = p; }, { passive: false });
  c.addEventListener('touchend', () => { down = false; });
}
function clearSig() { const c = $('sigPad'); if (!c) return; const x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height); sigDrawn = false; }

/* ===== 数据加载与渲染 ===== */
async function loadAll() {
  const [meJ, commJ, payoutJ] = await Promise.all([
    apiGet('/api/partner/me'),
    apiGet('/api/partner/commissions'),
    apiGet('/api/partner/payouts'),
  ]);
  me = meJ; commissions = commJ.commissions || []; payouts = payoutJ.payouts || [];
  $('loginView').style.display = 'none';
  $('signupView').style.display = 'none';
  $('appView').hidden = false;
  renderAll();
  window.scrollTo(0, 0);
}

function renderAll() {
  if (!me) return;
  const p = me.partner, st = me.stats;
  // 协议标题按 V1/V2
  const isV2 = p.contract_ver === 'V2';
  const agrTitle = isV2 ? 'Jirvs 战略合作伙伴合作协议' : 'Jirvs 生态合作伙伴合作协议';
  const agrVer = isV2 ? 'V2.1' : 'V1.1';

  $('hName').textContent = p.name + (p.type === 'company' ? '（企业）' : '（个人）') + ' · ' + (isV2 ? 'V2 战略' : 'V1 生态');
  $('hCode').textContent = p.ref_code || '—';
  $('hSignTag').innerHTML = p.sign_status === 'signed' ? '<span class="tag ok">已签署</span>' : '<span class="tag bad">未签署</span>';
  $('refLink').textContent = p.ref_code ? 'https://portal.jirvs.com/?ref=' + p.ref_code : '—';

  // 只显示自己的比例
  const rateText = isV2 ? 'V2 战略合作伙伴 50%' : 'V1 生态合作伙伴 30%';

  $('statCards').innerHTML = [
    ['推荐商户', st.merchants + ' 家', ''],
    ['待打款', '$' + Number(st.pending).toFixed(2), Number(st.pending) > 0 ? 'teal' : ''],
    ['累计已打款', '$' + Number(st.paid).toFixed(2), 'gold'],
    ['我的比例', rateText, 'teal'],
  ].map((c) => `<div class="stat"><div class="k">${c[0]}</div><div class="v ${c[2]}">${c[1]}</div>${c[0] === '待打款' ? '<div class="u">每月 5 日打出上月</div>' : ''}</div>`).join('');

  // 佣金明细
  $('commRows').innerHTML = commissions.length ? commissions.map((c) => `
    <tr><td>${esc((c.created_at || '').slice(0, 10))}</td>
    <td>${esc(c.merchant_name || c.merchant_id || '—')}</td>
    <td>$199.00</td><td>${c.rate}%</td><td>$${Number(c.amount).toFixed(2)}</td>
    <td>${c.status === 'paid' ? '<span class="tag ok">已打款</span>' : '<span class="tag warn">待打款</span>'}</td></tr>`
  ).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted)">暂无佣金记录</td></tr>';

  // 打款记录
  $('payoutRows').innerHTML = payouts.length ? payouts.map((r) => `
    <tr><td>${esc((r.created_at || '').slice(0, 10))}</td>
    <td>$${Number(r.amount).toFixed(2)}</td><td>$${Number(r.fee || 0).toFixed(2)}</td>
    <td>$${Number(r.net_amount || 0).toFixed(2)}</td>
    <td>${r.status === 'paid' ? '<span class="tag ok">已打款</span>' : '<span class="tag warn">' + esc(r.status) + '</span>'}</td>
    <td><button class="ghost" onclick="dlStatement('${esc(r.id)}')">下载</button></td></tr>`
  ).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted)">暂无打款记录</td></tr>';

  $('myAgrInfo').innerHTML =
    `<span class="tag ok">已签署</span>
     <span style="margin-left:10px">合同号：<b>${esc(p.contract_no || '—')}</b></span><br>
     <span style="margin-top:6px;display:inline-block">约定佣金比例：<b>${rateText}</b>（签署锁定，仅自己可见）</span>`;

  // 协议查看用动态标题
  window._agrTitle = agrTitle; window._agrVer = agrVer;
  renderBell();
}

function computeNotices() { return []; }
function renderBell() { const b = $('bellBadge'); if (b) b.hidden = true; }
function openNotices() {
  $('noticeList').innerHTML = '<p style="color:var(--muted)">暂无消息提醒。</p>';
  $('noticeModal').classList.add('open');
}
function copyRef() {
  const t = $('refLink').textContent;
  if (!t || t === '—') { toast('暂无推荐链接'); return; }
  copyText(t);
}
function dlStatement(payoutId) {
  const r = payouts.find((x) => String(x.id) === String(payoutId));
  if (!r || !me) return;
  const p = me.partner;
  const txt = ['Jirvs 生态合作伙伴佣金结算单', '———————————————',
    '合作伙伴：' + p.name, '推荐码：' + (p.ref_code || '—'),
    '打款时间：' + (r.created_at || '').slice(0, 10),
    '佣金（USD）：$' + Number(r.amount).toFixed(2),
    '渠道费用（USD）：$' + Number(r.fee || 0).toFixed(2),
    '实际到账（USD）：$' + Number(r.net_amount || 0).toFixed(2),
    '到账银行卡：' + (p.bank_account || '—'),
    '说明：每月 5 日打出上月佣金，通道实际费用已扣除，以银行实到为准。'].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + txt], { type: 'text/plain;charset=utf-8' }));
  a.download = 'Jirvs结算单-' + (r.created_at || '').slice(0, 10) + '.txt';
  a.click(); URL.revokeObjectURL(a.href);
  toast('结算单已生成');
}
function openAgrView() {
  if (!me) return;
  const p = me.partner;
  const isV2 = p.contract_ver === 'V2';
  const html = AGREEMENT_HTML
    .replace(/Jirvs 生态合作伙伴合作协议/g, window._agrTitle || 'Jirvs 生态合作伙伴合作协议')
    .replace(/V1\.1/g, window._agrVer || 'V1.1');
  $('agrViewBox').innerHTML = html;
  const rateText = isV2 ? 'V2 战略合作伙伴 50%' : 'V1 生态合作伙伴 30%';
  $('signRecord').innerHTML =
    `<b>签署记录</b><br>合同号：<b>${esc(p.contract_no || '—')}</b><br>协议版本：${window._agrVer || 'V1.1'}<br>` +
    `甲方：Jirvs Limited（系统确认）<br>乙方：<b>${esc(p.name)}</b>（${p.type === 'company' ? '企业' : '个人'}）<br>` +
    `乙方联系电话：${esc(p.phone || '—')}<br>乙方电子邮箱：${esc(p.email || '—')}<br>` +
    `乙方收款银行卡：${esc(p.bank_account || '—')}<br>` +
    `约定佣金比例：<b>${rateText}</b>（签署锁定）<br>签署时间：${esc(p.signed_at || '')}`;
  $('agrModal').classList.add('open');
}

(async function () {
  try { await loadAll(); } catch (e) { /* 未登录，停留在登录页 */ }
})();
</script>
